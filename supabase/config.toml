# Minimal Supabase CLI config for local development.
# Run `supabase start` after installing the Supabase CLI, then
# `supabase db push` to apply the migrations in supabase/migrations/.

project_id = "ordine"

[api]
enabled = true
port = 54321

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

[storage]
enabled = true
